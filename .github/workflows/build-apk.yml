
name: Compilar APK Android

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Fichas_Taller_GACA_VII_v1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          unzip -o Fichas_Taller_GACA_VII_v1.zip -d source
          test -f source/android-wrapper/app/build.gradle
          test -f source/android-wrapper/app/src/main/assets/index.html

      - name: Compilar APK de prueba
        working-directory: source/android-wrapper
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Fichas-Taller-GACA-VII-APK
          path: source/android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
